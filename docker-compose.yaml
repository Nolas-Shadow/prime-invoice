version: '3.8'

# Local Canton nodes for DAML experiments. This is NOT a complete ledger:
# - participant is not auto-connected to the synchronizer (needs a bootstrap script)
# - HTTP JSON API on :7575 is not included (ui/src/damlClient.ts and the Solidity
#   bridge expect it). See AUDIT.md P0-9 / P1-4.
# SDK in daml.yaml is 2.8.0; this image is 2.7.9 — align before relying on DAR uploads.

services:
  # The participant node where our DAML code runs and our users transact
  participant:
    image: digitalasset/canton-open-source:2.7.9
    command: daemon -c /config/participant.conf
    volumes:
      - ./config:/config
    ports:
      - "5011:5011" # Ledger API
      - "5012:5012" # Admin API
    depends_on:
      postgres:
        condition: service_healthy

  # The synchronizer handles routing and ordering of messages between our node and others
  synchronizer:
    image: digitalasset/canton-open-source:2.7.9
    command: daemon -c /config/synchronizer.conf
    volumes:
      - ./config:/config
    ports:
      - "5028:5028" # Public API
      - "5029:5029" # Admin API
    depends_on:
      postgres:
        condition: service_healthy

  # The PostgreSQL database to store the encrypted node state locally
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: canton
      POSTGRES_PASSWORD: canton_password
      POSTGRES_DB: canton_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canton -d canton_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres-init.sh:/docker-entrypoint-initdb.d/01-create-dbs.sh

volumes:
  postgres_data:
